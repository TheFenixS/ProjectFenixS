<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fenix Tools - CS2 Tracking Suite</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { min-height: 100vh; }
  body { background: #0A0C0F; color: #E8EBF0; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #FF6B2B44; border-radius: 3px; }
  #bg-video {
    position: fixed; top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%) scale(1.08);
    z-index: 0;
    filter: blur(14px) brightness(0.18) saturate(1.4);
    pointer-events: none;
  }
  #root { position: relative; z-index: 1; }
  .glass {
    background: rgba(15, 18, 22, 0.84);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,107,43,0.11);
    border-radius: 10px;
  }
  input, button, textarea { font-family: 'Inter', system-ui, sans-serif; }
  input:focus, textarea:focus { outline: none; border-color: #FF6B2B !important; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn 0.3s ease both; }
  #bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle at top right, rgba(255,107,43,0.18), transparent 24%),
                radial-gradient(circle at 10% 40%, rgba(255,255,255,0.04), transparent 14%);
    mix-blend-mode: screen;
  }
  .header-stats { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 12px; margin-top: 18px; }
  .header-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,107,43,0.14); border-radius: 16px; padding: 16px 18px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .header-card-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.64); margin-bottom: 10px; }
  .header-card-value { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 30px; color: #FFFFFF; line-height: 1; }
  .yt-chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; }
  .yt-chip svg { width: 16px; height: 16px; }
</style>
</head>
<body>

<video id="bg-video" autoplay muted loop playsinline poster="https://huggingface.co/datasets/YtFenixS/Fenixmedia/resolve/main/Fenixengine.jpg" crossorigin="anonymous">
  <source src="https://huggingface.co/datasets/YtFenixS/Fenixmedia/resolve/main/Fenixengine.mp4" type="video/mp4" />
</video>
<div id="bg-overlay"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useEffect } = React;

// ─── TÄSSÄ ON UUSI REITITYS VERCEL PROXYYN ─────────────────────────────────
const API_ROUTES = {
  inventory: "/api/inventory",
  pump: "/api/pump",
  portfolio: "/api/portfolio",
};
// ─────────────────────────────────────────────────────────────────────────

const F = { bg: '#0A0C0F', accent: '#FF6B2B', text: '#E8EBF0', muted: '#6B7585', border: 'rgba(255,107,43,0.11)', accentGlow: 'rgba(255,107,43,0.14)' };

function Spinner({ size = 18 }) {
  return <div style={{ width: size, height: size, border: `2px solid rgba(255,107,43,0.15)`, borderTopColor: F.accent, borderRadius: '50%', animation: 'spin 0.7s linear infinite', display: 'inline-block', flexShrink: 0 }} />;
}

function InventoryView() {
  const [url, setUrl] = useState('https://steamcommunity.com/id/NotnFaZe');
  const [loading, setLoading] = useState(false);
  const [items, setItems] = useState([]);
  const [error, setError] = useState('');
  const [page, setPage] = useState(1);
  const PAGE_SIZE = 20;

  const handleScan = useCallback(async () => {
    if (!url.trim() || loading) return;
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API_ROUTES.inventory}/api/scrape`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ steam_url: url.trim(), force: false }),
      });
      if (!res.ok) throw new Error(await res.text());
      const d = await res.json();
      setItems(d.items); setPage(1);
    } catch (e) { setError(e.message || 'Failed to fetch inventory'); } finally { setLoading(false); }
  }, [url, loading]);

  const stats = { count: items.length, value: items.reduce((s, i) => s + i.price, 0) };
  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  const pageItems = items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  return (
    <div className="glass" style={{ padding: '20px', marginBottom: 22 }}>
      {error && <div style={{ padding: '9px 15px', borderRadius: 7, background: 'rgba(255,68,68,0.1)', border: '1px solid rgba(255,68,68,0.28)', color: '#FF6868', fontSize: 13, marginBottom: 15 }}>⚠ {error}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 20 }}>
        <div style={{ background: 'rgba(255,255,255,0.03)', padding: '16px', borderRadius: 7, border: `1px solid ${F.border}` }}><div style={{ fontSize: 10, color: F.muted, textTransform: 'uppercase', marginBottom: 6 }}>Total Items</div><div style={{ fontSize: 32, fontWeight: 700, color: F.text, fontFamily: "'Bebas Neue', Impact, sans-serif" }}>{stats.count}</div></div>
        <div style={{ background: F.accentGlow, padding: '16px', borderRadius: 7, border: `1px solid ${F.accent}` }}><div style={{ fontSize: 10, color: F.accent, textTransform: 'uppercase', marginBottom: 6 }}>Total Value</div><div style={{ fontSize: 32, fontWeight: 700, color: F.accent, fontFamily: "'Bebas Neue', Impact, sans-serif" }}>${stats.value.toLocaleString('en-US', { maximumFractionDigits: 2 })}</div></div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '50px 3fr 120px 100px 100px', gap: 10, padding: '10px 0', borderBottom: `1px solid ${F.border}`, marginBottom: 10, fontSize: 11, color: F.muted, fontWeight: 600 }}><div>#</div><div>NAME</div><div>RARITY</div><div>TYPE</div><div style={{ textAlign: 'right' }}>PRICE</div></div>
      {pageItems.length === 0 ? <div style={{ padding: '50px 0', textAlign: 'center', color: F.muted, fontSize: 13 }}>No items. Scan a Steam profile to begin.</div> : pageItems.map((item, i) => (
        <div key={`${item.assetId}-${i}`} style={{ display: 'grid', gridTemplateColumns: '50px 3fr 120px 100px 100px', alignItems: 'center', gap: 10, padding: '10px 0', borderBottom: `1px solid rgba(255,255,255,0.022)` }}>
          <div style={{ fontSize: 11, color: F.muted }}>{(page - 1) * PAGE_SIZE + i + 1}</div><div style={{ fontSize: 13, color: F.text }}>{item.name}</div><div style={{ fontSize: 11, padding: '2px 6px', borderRadius: 4, background: `rgba(255,107,43,0.15)`, color: F.accent }}>{item.rarity}</div><div style={{ fontSize: 12, color: F.muted }}>{item.weaponType}</div><div style={{ fontSize: 13, fontWeight: 700, textAlign: 'right', color: item.price >= 100 ? F.accent : F.text }}>${item.price.toFixed(2)}</div>
        </div>
      ))}
      {totalPages > 1 && (
        <div style={{ display: 'flex', justifyContent: 'center', gap: 10, padding: '20px 0', marginTop: 10 }}>
          <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1} style={{ padding: '8px 16px', borderRadius: 6, border: `1px solid ${F.border}`, background: 'transparent', color: page === 1 ? F.muted : F.text, cursor: 'pointer' }}>← Prev</button>
          <span style={{ color: F.muted, alignSelf: 'center' }}>Page <b style={{ color: F.text }}>{page}</b> of {totalPages}</span>
          <button onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page === totalPages} style={{ padding: '8px 16px', borderRadius: 6, border: `1px solid ${F.border}`, background: 'transparent', color: page === totalPages ? F.muted : F.text, cursor: 'pointer' }}>Next →</button>
        </div>
      )}
    </div>
  );
}

function PumpView() {
  const [url, setUrl] = useState('');
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [error, setError] = useState('');

  const handleAnalyze = useCallback(async () => {
    if (!url.trim() || loading) return;
    setLoading(true); setError(''); setData(null);
    try {
      const res = await fetch(`${API_ROUTES.pump}/api/analyze`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url.trim() }),
      });
      if (!res.ok) throw new Error(await res.text());
      const d = await res.json(); setData(d);
    } catch (e) { setError(e.message || 'Failed to analyze'); } finally { setLoading(false); }
  }, [url, loading]);

  return (
    <div className="glass" style={{ padding: '20px', marginBottom: 22 }}>
      {error && <div style={{ padding: '9px 15px', borderRadius: 7, background: 'rgba(255,68,68,0.1)', border: '1px solid rgba(255,68,68,0.28)', color: '#FF6868', fontSize: 13, marginBottom: 15 }}>⚠ {error}</div>}
      {data && data.result && (
        <div style={{ animation: 'fadeIn 0.3s ease' }}>
          <h3 style={{ color: F.accent, marginBottom: 15, fontSize: 16 }}>{data.name}</h3>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 12, marginBottom: 20 }}>
            <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: 7, border: `1px solid ${F.border}`, textAlign: 'center' }}><div style={{ fontSize: 10, color: F.muted, marginBottom: 6 }}>PUMP SCORE</div><div style={{ fontSize: 24, fontWeight: 700, color: F.accent }}>{data.result.pump_score}</div><div style={{ fontSize: 10, color: F.muted, marginTop: 6 }}>{data.result.pump_label}</div></div>
            <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: 7, border: `1px solid ${F.border}`, textAlign: 'center' }}><div style={{ fontSize: 10, color: F.muted, marginBottom: 6 }}>PRICE</div><div style={{ fontSize: 24, fontWeight: 700, color: F.text }}>${data.result.price.toFixed(2)}</div><div style={{ fontSize: 10, color: F.muted, marginTop: 6 }}>USD</div></div>
            <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: 7, border: `1px solid ${F.border}`, textAlign: 'center' }}><div style={{ fontSize: 10, color: F.muted, marginBottom: 6 }}>DNA</div><div style={{ fontSize: 16, fontWeight: 700, color: F.text }}>{data.result.dna_label}</div><div style={{ fontSize: 10, color: F.muted, marginTop: 6 }}>{data.result.dna_score}</div></div>
            <div style={{ background: 'rgba(255,255,255,0.03)', padding: '14px', borderRadius: 7, border: `1px solid ${F.border}`, textAlign: 'center' }}><div style={{ fontSize: 10, color: F.muted, marginBottom: 6 }}>STATUS</div><div style={{ fontSize: 16, fontWeight: 700, color: data.result.is_exploding ? '#FF6B6B' : F.accent }}>{data.result.mode}</div></div>
          </div>
          {data.chart_base64 && <img src={`data:image/png;base64,${data.chart_base64}`} style={{ width: '100%', maxWidth: '100%', borderRadius: 7, border: `1px solid ${F.border}`, marginBottom: 15 }} />}
        </div>
      )}
      {!data && !loading && !error && <div style={{ padding: '50px 0', textAlign: 'center', color: F.muted, fontSize: 13 }}>Paste a SteamDT item URL to analyze for pump signals.</div>}
    </div>
  );
}

function PortfolioView({ initialUser = '' }) {
  const [userId, setUserId] = useState(initialUser || 'me');
  const [profileUrl, setProfileUrl] = useState('https://steamcommunity.com/id/NotnFaZe');
  const [loading, setLoading] = useState(false);
  const [items, setItems] = useState([]);
  const [portfolio, setPortfolio] = useState([]);
  const [msg, setMsg] = useState('');

  const importFromProfile = useCallback(async () => {
    if (!profileUrl.trim() || !userId.trim()) return;
    setLoading(true); setMsg('');
    try {
      const res = await fetch(`${API_ROUTES.inventory}/api/scrape`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ steam_url: profileUrl.trim(), force: false }) });
      if (!res.ok) throw new Error('Inventory fetch failed');
      const d = await res.json();
      const imp = await fetch(`${API_ROUTES.portfolio}/api/import`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ user_id: userId.trim(), items: d.items }) });
      if (!imp.ok) throw new Error('Import failed');
      const r = await imp.json(); setItems(r.items || []); setMsg('Imported snapshot');
    } catch (e) { setMsg(e.message || 'Failed'); } finally { setLoading(false); }
  }, [profileUrl, userId]);

  const loadPortfolio = useCallback(async () => {
    if (!userId.trim()) return;
    setLoading(true); setMsg('');
    try {
      const res = await fetch(`${API_ROUTES.portfolio}/api/portfolio/${encodeURIComponent(userId.trim())}`);
      if (!res.ok) throw new Error('Failed to load portfolio');
      const d = await res.json(); setPortfolio(d.items || []);
    } catch (e) { setMsg(e.message || 'Failed'); } finally { setLoading(false); }
  }, [userId]);

  const adjustItem = useCallback(async (name, change, reason='adjust') => {
    if (!userId.trim()) return;
    try {
      await fetch(`${API_ROUTES.portfolio}/api/adjust`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ user_id: userId.trim(), name, change, reason }) });
      setMsg('Adjustment saved'); loadPortfolio();
    } catch (e) { setMsg('Adjustment failed'); }
  }, [userId, loadPortfolio]);

  useEffect(() => { if (initialUser) { loadPortfolio(); setMsg(`Auto-loaded portfolio for ${initialUser}`); } }, []);

  return (
    <div className="glass" style={{ padding: '20px', marginBottom: 22 }}>
      <div style={{ display: 'flex', gap: 12, marginBottom: 12 }}>
        <input value={userId} onChange={e=>setUserId(e.target.value)} placeholder="User id" style={{padding:10, borderRadius:8, border:`1px solid ${F.border}`}} />
        <input value={profileUrl} onChange={e=>setProfileUrl(e.target.value)} placeholder="Steam profile URL" style={{flex:1,padding:10,borderRadius:8,border:`1px solid ${F.border}`}} />
        <button onClick={importFromProfile} disabled={loading} style={{padding:'10px 14px', borderRadius:8, background:`linear-gradient(135deg, ${F.accent}, #C44E18)`, color:'#fff', border:'none'}}>{loading?'IMPORTING…':'Import'}</button>
        <button onClick={loadPortfolio} disabled={loading} style={{padding:'10px 14px', borderRadius:8, background:'transparent', border:`1px solid ${F.border}`, color:F.text}}>{loading?'LOADING…':'Load saved'}</button>
      </div>
      {msg && <div style={{marginBottom:10,color:F.muted}}>{msg}</div>}
      
      {portfolio.length > 0 && (
        <div>
          <div style={{fontSize:12,color:F.muted,marginBottom:8}}>Saved portfolio</div>
          {portfolio.map(p => (
            <div key={p.item_name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 10px',borderBottom:'1px solid rgba(255,255,255,0.03)'}}>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{p.item_name}</div><div style={{fontSize:12,color:F.muted}}>Qty: {p.quantity} • Avg ${p.avg_price.toFixed(2)}</div></div>
            </div>
          ))}
        </div>
      )}
      {!items.length && !portfolio.length && <div style={{padding:40,textAlign:'center',color:F.muted}}>Import an inventory snapshot or load a saved portfolio to begin.</div>}
    </div>
  );
}

function App() {
  const [view, setView] = useState('inventory');
  const [invUrl, setInvUrl] = useState('https://steamcommunity.com/id/NotnFaZe');
  const [pumpUrl, setPumpUrl] = useState('');
  const [invLoading, setInvLoading] = useState(false);
  const [items, setItems] = useState([]);

  const handleInventoryScan = useCallback(async () => {
    if (view === 'pump') {
       if(!pumpUrl) return;
       // ... trigger pump scan
       return;
    }
    if (!invUrl.trim() || invLoading) return;
    setInvLoading(true);
    try {
      const res = await fetch(`${API_ROUTES.inventory}/api/scrape`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ steam_url: invUrl.trim(), force: false }) });
      if (res.ok) setItems((await res.json()).items);
    } catch (e) { } finally { setInvLoading(false); }
  }, [invUrl, pumpUrl, view, invLoading]);

  return (
    <div style={{ minHeight: '100vh', paddingBottom: 60 }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 100, background: 'rgba(6,8,11,0.93)', backdropFilter: 'blur(20px)', borderBottom: `1px solid ${F.border}`, padding: '15px 30px' }}>
        <div style={{ maxWidth: 1400, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 44, height: 44, borderRadius: 9, overflow: 'hidden', boxShadow: '0 0 22px rgba(255,107,43,0.48)', border: '1px solid rgba(255,107,43,0.32)', flexShrink: 0 }}>
              <span style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 24, background: `linear-gradient(135deg, ${F.accent} 0%, #C44E18 100%)` }}>🔥</span>
            </div>
            <div><div style={{ fontSize: 21, fontWeight: 700, fontFamily: "'Bebas Neue', Impact, sans-serif", letterSpacing: '0.08em', color: F.text }}>FENIX TOOLS</div><div style={{ fontSize: 11, color: F.muted, letterSpacing: '0.12em', textTransform: 'uppercase' }}>CS2 TRACKING SUITE</div></div>
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            {[{ id: 'inventory', label: '📦 Inventory', color: '#FF6B2B' }, { id: 'pump', label: '🐠 Pump', color: '#FF9F43' }, { id: 'portfolio', label: '💼 Portfolio', color: '#A29BFE' }].map(tool => (
              <button key={tool.id} onClick={() => setView(tool.id)} style={{ padding: '8px 14px', borderRadius: 6, fontSize: 12, fontWeight: 600, border: view === tool.id ? `2px solid ${tool.color}` : `1px solid ${F.border}`, background: view === tool.id ? `rgba(255,107,43,0.1)` : 'transparent', color: view === tool.id ? tool.color : F.text, cursor: 'pointer' }}>{tool.label}</button>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, flex: '1 1 300px' }}>
            <input value={view === 'pump' ? pumpUrl : invUrl} onChange={e => view === 'pump' ? setPumpUrl(e.target.value) : setInvUrl(e.target.value)} placeholder={view === 'pump' ? "SteamDT.com item URL…" : "Steam profile URL…"} style={{ flex: 1, background: 'rgba(255,255,255,0.04)', border: `1px solid ${F.border}`, borderRadius: 7, padding: '10px 14px', color: F.text, fontSize: 13 }} />
            <button onClick={handleInventoryScan} disabled={invLoading} style={{ padding: '10px 22px', borderRadius: 7, fontSize: 13, fontWeight: 700, border: 'none', cursor: invLoading ? 'not-allowed' : 'pointer', background: invLoading ? '#C44E18' : `linear-gradient(135deg, ${F.accent} 0%, #C44E18 100%)`, color: '#fff', display: 'flex', alignItems: 'center', gap: 7, whiteSpace: 'nowrap' }}>
              {invLoading ? <Spinner size={13} /> : (view === 'pump' ? 'ANALYZE' : 'SCAN')}
            </button>
          </div>
        </div>
      </div>
      <div style={{ maxWidth: 1400, margin: '0 auto', padding: '22px 24px' }}>
        {view === 'inventory' && <InventoryView />}
        {view === 'pump' && <PumpView />}
        {view === 'portfolio' && <PortfolioView />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
