<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fenix Inventory</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100vh}
body{
  background:#050709;
  color:#D4D8E0;
  font-family:'Rajdhani',system-ui,sans-serif;
  overflow-x:hidden;
}
:root{
  --bg:#050709;
  --bg1:#080B0F;
  --bg2:#0C1018;
  --bg3:#111620;
  --bg4:#161C28;
  --bg5:#1C2333;
  --accent:#FF5C1A;
  --accent2:#FF8A4C;
  --accentd:rgba(255,92,26,0.12);
  --accentd2:rgba(255,92,26,0.06);
  --border:rgba(255,92,26,0.14);
  --border2:rgba(255,255,255,0.06);
  --border3:rgba(255,255,255,0.04);
  --text:#D4D8E0;
  --text2:#8A9AB5;
  --text3:#4A5568;
  --green:#3DCC7E;
  --greend:rgba(61,204,126,0.1);
  --greenb:rgba(61,204,126,0.2);
  --red:#F05050;
  --redd:rgba(240,80,80,0.08);
  --redb:rgba(240,80,80,0.2);
  --blue:#4A9EFF;
  --gold:#FFB347;
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,92,26,0.25);border-radius:2px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,26,0.4)}50%{box-shadow:0 0 0 8px rgba(255,92,26,0)}}
@keyframes scanline{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes birdFly{
  0%{transform:translateX(-40px) translateY(0) scaleX(1)}
  25%{transform:translateX(0) translateY(-5px) scaleX(1)}
  50%{transform:translateX(40px) translateY(0) scaleX(1)}
  75%{transform:translateX(0) translateY(5px) scaleX(-1)}
  100%{transform:translateX(-40px) translateY(0) scaleX(1)}
}
@keyframes wingFlap{
  0%,100%{d:path("M16 8 C10 4, 4 6, 2 12 C6 10, 10 10, 16 8Z M16 8 C22 4, 28 6, 30 12 C26 10, 22 10, 16 8Z")}
  50%{d:path("M16 8 C10 10, 4 8, 2 4 C6 6, 10 8, 16 8Z M16 8 C22 10, 28 8, 30 4 C26 6, 22 8, 16 8Z")}
}
@keyframes glow{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes chartGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.fade-up{animation:fadeUp 0.28s ease both}
.spinner{width:16px;height:16px;border:1.5px solid rgba(255,92,26,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.65s linear infinite;display:inline-block;flex-shrink:0}

/* Bird SVG */
.fenix-bird{animation:birdFly 4s ease-in-out infinite}

/* HEADER */
.hdr{
  position:sticky;top:0;z-index:200;
  background:rgba(5,7,9,0.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
}
.hdr-inner{
  max-width:1600px;margin:0 auto;
  display:flex;align-items:center;gap:16px;
  padding:10px 24px;flex-wrap:wrap;
}

/* Logo */
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:default}
.logo-mark{
  position:relative;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.logo-mark svg{filter:drop-shadow(0 0 10px rgba(255,92,26,0.6))}
.logo-text{line-height:1}
.logo-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px;font-weight:800;letter-spacing:0.12em;
  color:#fff;text-transform:uppercase;
}
.logo-sub{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--text3);letter-spacing:0.2em;
  text-transform:uppercase;margin-top:1px;
}

/* Nav */
.nav{display:flex;gap:2px;flex-shrink:0}
.nav-btn{
  padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;
  border:1px solid transparent;background:transparent;color:var(--text3);
  cursor:pointer;transition:all 0.15s;position:relative;
}
.nav-btn::after{
  content:'';position:absolute;bottom:0;left:50%;right:50%;height:1px;
  background:var(--accent);transition:all 0.2s;
}
.nav-btn:hover{color:var(--text);background:var(--bg3)}
.nav-btn.active{color:var(--accent);border-color:var(--border)}
.nav-btn.active::after{left:12px;right:12px}

/* Search bar */
.searchbar{display:flex;gap:8px;flex:1 1 320px;min-width:0}
.search-input{
  flex:1;min-width:0;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:7px;padding:9px 14px;color:var(--text);
  font-size:13px;font-family:'Rajdhani',sans-serif;
  transition:border-color 0.15s;
}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.btn-scan{
  padding:9px 20px;border-radius:7px;font-size:13px;font-weight:700;
  letter-spacing:0.06em;font-family:'Barlow Condensed',sans-serif;
  border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#C44318);
  color:#fff;white-space:nowrap;transition:all 0.15s;
  display:flex;align-items:center;gap:8px;
}
.btn-scan:hover:not(:disabled){opacity:0.88;transform:translateY(-1px)}
.btn-scan:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-refresh{
  padding:9px 12px;border-radius:7px;font-size:13px;
  border:1px solid var(--border2);background:transparent;color:var(--text2);
  cursor:pointer;transition:all 0.15s;
}
.btn-refresh:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn-refresh:disabled{opacity:0.5;cursor:not-allowed}

/* Main layout */
.main{max-width:1600px;margin:0 auto;padding:20px 24px 60px}

/* Panel */
.panel{
  background:rgba(12,16,24,0.85);border:1px solid var(--border);
  border-radius:12px;backdrop-filter:blur(8px);
}

/* Stats row */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat-card{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:9px;padding:16px;
}
.stat-card.hot{
  background:rgba(255,92,26,0.07);
  border-color:rgba(255,92,26,0.3);
}
.stat-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--text3);margin-bottom:8px;
}
.stat-val{
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:800;line-height:1;color:var(--text);
  letter-spacing:0.04em;
}
.stat-card.hot .stat-label{color:rgba(255,92,26,0.7)}
.stat-card.hot .stat-val{color:var(--accent)}

/* Table */
.tbl-wrap{overflow-x:auto}
.tbl-head{
  display:grid;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--border2);
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--text3);font-weight:500;
}
.tbl-row{
  display:grid;gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--border3);
  align-items:center;font-size:13px;
  transition:background 0.1s;cursor:default;
}
.tbl-row:hover{background:rgba(255,255,255,0.015)}
.tbl-row:last-child{border-bottom:none}

.inv-grid{grid-template-columns:36px 3fr 130px 110px 84px}
.port-grid{grid-template-columns:3fr 60px 90px 90px}
.chg-grid{grid-template-columns:2fr 90px 100px 2fr}
.ovw-grid{grid-template-columns:32px 3fr 80px 90px}

/* Rarity pill */
.rarity{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;padding:2px 7px;border-radius:3px;
  display:inline-block;white-space:nowrap;letter-spacing:0.05em;
}

/* Section header */
.sec-hdr{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;
}
.sec-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:16px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--accent);
}

/* Pager */
.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:18px 0 4px}
.pager button{
  padding:7px 14px;border-radius:5px;border:1px solid var(--border2);
  background:transparent;color:var(--text);cursor:pointer;font-size:12px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.05em;
  transition:border-color 0.15s;
}
.pager button:disabled{color:var(--text3);cursor:not-allowed}
.pager button:not(:disabled):hover{border-color:var(--accent)}
.pager span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)}

/* Filter pills */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{
  padding:5px 12px;border-radius:4px;font-size:11px;font-weight:700;
  letter-spacing:0.07em;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;
  cursor:pointer;border:1px solid var(--border2);background:transparent;
  color:var(--text3);transition:all 0.14s;
}
.pill:hover:not(.active){border-color:rgba(255,92,26,0.3);color:var(--text2)}
.pill.active{border-color:var(--accent);background:var(--accentd);color:var(--accent)}

/* Sidebar */
.sidebar{
  flex:0 0 290px;
  position:sticky;top:82px;
  max-height:calc(100vh - 100px);
  overflow-y:auto;
  display:flex;flex-direction:column;gap:16px;
}
.sbar-sect{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:9px;padding:16px;
}
.sbar-title{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--text3);margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border3);
}

/* Day tabs */
.day-tab{
  padding:3px 8px;border-radius:3px;font-size:10px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:0.08em;
  cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text3);
  transition:all 0.12s;
}
.day-tab.active{border-color:var(--accent);background:var(--accentd);color:var(--accent)}

/* Category button */
.cat-btn{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-radius:5px;font-size:12px;font-weight:600;
  letter-spacing:0.04em;font-family:'Barlow Condensed',sans-serif;
  cursor:pointer;background:transparent;color:var(--text2);border:none;
  border-left:2px solid transparent;transition:all 0.13s;width:100%;text-align:left;
}
.cat-btn:hover{background:var(--bg4);color:var(--text)}
.cat-btn.active{background:var(--accentd);color:var(--accent);border-left-color:var(--accent)}

/* Bulk item */
.bulk-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;background:var(--bg3);border-radius:4px;
  border:1px solid var(--border3);gap:8px;
}
.cnt-badge{
  font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;
  color:var(--accent);background:var(--accentd);
  padding:2px 5px;border-radius:3px;flex-shrink:0;
}

/* Item link */
.item-link{
  color:var(--text);text-decoration:none;
  transition:color 0.14s;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-link:hover{color:var(--accent)}

/* Changes panel */
.chg-row-g{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:rgba(61,204,126,0.04);
  border-radius:4px;border:1px solid rgba(61,204,126,0.09);
  gap:6px;margin-bottom:3px;
}
.chg-row-l{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:rgba(240,80,80,0.04);
  border-radius:4px;border:1px solid rgba(240,80,80,0.09);
  gap:6px;margin-bottom:3px;
}

/* Batch panel */
.batch-textarea{
  width:100%;height:140px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border2);
  border-radius:6px;padding:10px;color:var(--text);
  font-size:10px;resize:vertical;font-family:'JetBrains Mono',monospace;
  outline:none;
}
.batch-textarea:focus{border-color:var(--accent)}

.log-item{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.02);padding:4px 6px;border-radius:3px;
  margin-bottom:3px;
}

/* Inputs */
.inp{
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:6px;padding:8px 12px;color:var(--text);
  font-size:12px;font-family:'Rajdhani',sans-serif;
  transition:border-color 0.15s;width:100%;
}
.inp:focus{outline:none;border-color:var(--accent)}
.inp::placeholder{color:var(--text3)}

/* Buttons */
.btn-pri{
  padding:9px 16px;border-radius:6px;border:none;
  background:linear-gradient(135deg,var(--accent),#C44318);
  color:#fff;font-size:12px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:0.06em;
  cursor:pointer;white-space:nowrap;transition:opacity 0.14s;
  display:flex;align-items:center;gap:7px;
}
.btn-pri:disabled{opacity:0.55;cursor:not-allowed}
.btn-pri:not(:disabled):hover{opacity:0.88}
.btn-ghost{
  padding:9px 14px;border-radius:6px;border:1px solid var(--border2);
  background:transparent;color:var(--text2);font-size:12px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:0.04em;
  cursor:pointer;transition:border-color 0.14s;white-space:nowrap;
}
.btn-ghost:not(:disabled):hover{border-color:var(--accent);color:var(--text)}
.btn-ghost:disabled{opacity:0.5;cursor:not-allowed}

/* Status badges */
.badge-g{
  font-size:10px;font-weight:700;letter-spacing:0.06em;
  padding:2px 7px;border-radius:3px;font-family:'Barlow Condensed',sans-serif;
  background:var(--greend);color:var(--green);border:1px solid var(--greenb);
}
.badge-r{
  font-size:10px;font-weight:700;letter-spacing:0.06em;
  padding:2px 7px;border-radius:3px;font-family:'Barlow Condensed',sans-serif;
  background:var(--redd);color:var(--red);border:1px solid var(--redb);
}

/* Hot alert */
.hot-alert{
  background:rgba(240,80,80,0.06);
  border:1px solid rgba(240,80,80,0.28);
  border-radius:9px;padding:16px 18px;margin-bottom:14px;
}

/* Mini chart */
.chart-svg{width:100%;display:block;overflow:visible}

/* Empty + center states */
.empty{padding:48px 20px;text-align:center;color:var(--text3);font-size:13px}
.ctr{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px 20px;color:var(--text3);font-size:13px}

/* Error */
.err{
  padding:10px 14px;border-radius:6px;margin-bottom:14px;
  background:rgba(240,80,80,0.07);border:1px solid rgba(240,80,80,0.22);
  color:var(--red);font-size:12px;
}

/* YT button */
.yt-btn{
  display:flex;align-items:center;gap:5px;padding:4px 8px;
  border-radius:4px;background:rgba(255,30,30,0.1);
  border:1px solid rgba(255,60,60,0.2);color:#FF5555;
  text-decoration:none;font-size:10px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:0.06em;
  transition:all 0.15s;flex-shrink:0;
}
.yt-btn:hover{background:rgba(255,30,30,0.2);border-color:rgba(255,60,60,0.4)}

/* Tracker layout */
.tracker-layout{display:flex;gap:18px;align-items:flex-start}
.tracker-main{flex:1 1 0;min-width:0}

/* Sort icon */
.sort-ico{opacity:0.25;margin-left:3px;font-size:10px}
.sort-ico.on{color:var(--accent);opacity:1}

/* Bar chart for flow */
.flow-bar{border-radius:2px;transition:height 0.3s}

/* Grid bg lines on header */
.hdr::before{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(255,92,26,0.04) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(rgba(255,92,26,0.04) 1px,transparent 1px) 0 0/40px 40px;
  opacity:0.4;pointer-events:none;z-index:-1;
}
.hdr{position:sticky}

/* Responsive */
@media(max-width:1100px){
  .tracker-layout{flex-wrap:wrap}
  .sidebar{flex:1 1 300px;position:static;max-height:none}
}
@media(max-width:700px){
  .hdr-inner{padding:10px 16px}
  .nav{display:none}
  .inv-grid{grid-template-columns:28px 2fr 80px 70px}
  .main{padding:14px 14px 40px}
}
</style>
</head>
<body>
<video id="bgvid" autoplay muted loop playsinline style="position:fixed;top:50%;left:50%;min-width:100%;min-height:100%;transform:translate(-50%,-50%) scale(1.06);z-index:0;filter:blur(18px) brightness(0.12) saturate(1.5);pointer-events:none">
  <source src="https://huggingface.co/datasets/YtFenixS/Fenixmedia/resolve/main/Fenixengine.mp4" type="video/mp4"/>
</video>
<div id="root" style="position:relative;z-index:1"></div>

<script type="text/babel">
const{useState,useMemo,useCallback,useEffect,useRef}=React;

// ═══════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════
const RARITY_COLORS={
  'Consumer Grade':'#8BA0B8','Base Grade':'#8BA0B8',
  'Industrial Grade':'#5591D4',
  'Mil-Spec Grade':'#4B69FF','High Grade':'#4B69FF',
  'Restricted':'#8847FF','Remarkable':'#8847FF',
  'Classified':'#D32CE6','Exotic':'#D32CE6',
  'Covert':'#EB4B4B','Extraordinary':'#EB4B4B',
  'Gold':'#FFD700','Contraband':'#E4AE33',
  'Normal':'#4A5568',
};
const RARITY_WEIGHT={
  'Normal':0,'Base Grade':1,'Consumer Grade':1,'Industrial Grade':2,
  'High Grade':3,'Mil-Spec Grade':3,'Remarkable':4,'Restricted':4,
  'Exotic':5,'Classified':5,'Extraordinary':6,'Covert':6,'Contraband':7,'Gold':8,
};
const rc=r=>RARITY_COLORS[r]||RARITY_COLORS['Normal'];

function getDisplayRarity(item){
  if(item.isKnife||item.isGlove)return'Gold';
  const r=(item.rarity||'').toLowerCase();
  const wt=(item.weaponType||'').toLowerCase();
  const isWeapon=wt.includes('pistol')||wt.includes('rifle')||wt.includes('smg')||wt.includes('shotgun')||wt.includes('machine')||wt.includes('weapon');
  if(r.includes('common')&&!r.includes('uncommon'))return isWeapon?'Consumer Grade':'Base Grade';
  if(r.includes('uncommon'))return'Industrial Grade';
  if(r.includes('rare'))return isWeapon?'Mil-Spec Grade':'High Grade';
  if(r.includes('mythical'))return isWeapon?'Restricted':'Remarkable';
  if(r.includes('legendary'))return isWeapon?'Classified':'Exotic';
  if(r.includes('ancient'))return isWeapon?'Covert':'Extraordinary';
  if(r.includes('contraband'))return'Contraband';
  return(item.rarity||'').replace(/ Weapon/gi,'').replace(/_/g,' ');
}

const PAGE=20;
const fmtVal=v=>'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

// ═══════════════════════════════════
// COMPONENTS
// ═══════════════════════════════════

function FenixBird(){
  return(
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg"
      style={{filter:'drop-shadow(0 0 10px rgba(255,92,26,0.7))'}}>
      {/* Phoenix bird - stylized */}
      <path d="M22 6 C18 10, 12 12, 8 18 C12 16, 16 17, 22 20 C28 17, 32 16, 36 18 C32 12, 26 10, 22 6Z" fill="#FF5C1A"/>
      <path d="M22 20 C16 22, 10 24, 8 30 C12 27, 17 26, 22 28 C27 26, 32 27, 36 30 C34 24, 28 22, 22 20Z" fill="#FF8A4C"/>
      <path d="M22 28 C18 32, 16 36, 18 40 C20 36, 22 34, 22 34 C22 34, 24 36, 26 40 C28 36, 26 32, 22 28Z" fill="#FFB347"/>
      <path d="M22 14 C20 16, 22 18, 22 18 C22 18, 24 16, 22 14Z" fill="#FFD700"/>
      {/* Spread wings hints */}
      <path d="M22 20 C16 18, 8 20, 4 24 C8 22, 14 21, 22 23Z" fill="#FF5C1A" opacity="0.7"/>
      <path d="M22 20 C28 18, 36 20, 40 24 C36 22, 30 21, 22 23Z" fill="#FF5C1A" opacity="0.7"/>
    </svg>
  );
}

function Spinner({size=16}){
  return<div className="spinner" style={{width:size,height:size}}/>;
}

function ItemLink({name,style={}}){

// ─── Mini Line Chart ─────────────────
function MiniLineChart({data}){
  const[hov,setHov]=useState(null);
  const W=260,H=100,PT=12,PB=18,PH=H-PT-PB;
  const tg=data?data.reduce((s,d)=>s+d.gained,0):0;
  const tl=data?data.reduce((s,d)=>s+d.lost,0):0;
  const hasData=data&&data.length>=2&&(tg>0||tl>0);

  if(!hasData) return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
        <div>
          <div style={{fontSize:9,color:'rgba(61,204,126,0.4)',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>Gained</div>
          <div style={{fontSize:22,fontWeight:800,color:'rgba(61,204,126,0.25)',fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.04em'}}>+0</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:9,color:'rgba(240,80,80,0.4)',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>Lost</div>
          <div style={{fontSize:22,fontWeight:800,color:'rgba(240,80,80,0.25)',fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.04em'}}>-0</div>
        </div>
      </div>
      <div style={{height:H,display:'flex',alignItems:'center',justifyContent:'center',
        color:'var(--text3)',fontSize:11,border:'1px dashed rgba(255,92,26,0.08)',
        borderRadius:5,background:'rgba(255,255,255,0.01)',fontFamily:"'JetBrains Mono',monospace"}}>
        no activity yet
      </div>
    </div>
  );

  const maxV=Math.max(...data.map(d=>Math.max(d.gained,d.lost)),1);
  const STEP=W/Math.max(1,data.length-1);
  const toCX=i=>i*STEP;
  const toCY=v=>PT+PH-(v/maxV)*PH;

  const buildPath=key=>{
    const pts=data.map((d,i)=>[toCX(i),toCY(d[key])]);
    let p=`M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const cpx=((pts[i-1][0]+pts[i][0])/2).toFixed(1);
      p+=` C ${cpx},${pts[i-1][1].toFixed(1)} ${cpx},${pts[i][1].toFixed(1)} ${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}`;
    }
    return p;
  };
  const buildFill=key=>{
    const pts=data.map((d,i)=>[toCX(i),toCY(d[key])]);
    const base=(PT+PH).toFixed(1);
    let p=`M ${pts[0][0].toFixed(1)},${base} L ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const cpx=((pts[i-1][0]+pts[i][0])/2).toFixed(1);
      p+=` C ${cpx},${pts[i-1][1].toFixed(1)} ${cpx},${pts[i][1].toFixed(1)} ${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}`;
    }
    p+=` L ${pts[pts.length-1][0].toFixed(1)},${base} Z`;
    return p;
  };

  const hovD=hov!==null?data[hov]:null;

  return(
    <div onMouseLeave={()=>setHov(null)}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:6}}>
        <div>
          <div style={{fontSize:9,color:'rgba(61,204,126,0.65)',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>Gained</div>
          <div style={{fontSize:22,fontWeight:800,lineHeight:1,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.04em',
            color:hovD?(hovD.gained>0?'var(--green)':'rgba(61,204,126,0.3)'):(tg>0?'var(--green)':'rgba(61,204,126,0.3)')}}>
            +{hovD?hovD.gained:tg}
          </div>
        </div>
        {hovD&&<div style={{fontSize:9,color:'var(--accent)',background:'var(--accentd)',padding:'2px 7px',borderRadius:10,border:'1px solid var(--border)',fontFamily:"'JetBrains Mono',monospace"}}>
          {23-hov===0?'now':`${23-hov}h ago`}
        </div>}
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:9,color:'rgba(240,80,80,0.65)',letterSpacing:'0.1em',textTransform:'uppercase',fontFamily:"'JetBrains Mono',monospace"}}>Lost</div>
          <div style={{fontSize:22,fontWeight:800,lineHeight:1,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.04em',
            color:hovD?(hovD.lost>0?'var(--red)':'rgba(240,80,80,0.3)'):(tl>0?'var(--red)':'rgba(240,80,80,0.3)')}}>
            -{hovD?hovD.lost:tl}
          </div>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block',overflow:'visible'}}>
        <defs>
          <linearGradient id="fgG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#3DCC7E" stopOpacity="0.35"/>
            <stop offset="100%" stopColor="#3DCC7E" stopOpacity="0"/>
          </linearGradient>
          <linearGradient id="fgR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#F05050" stopOpacity="0.3"/>
            <stop offset="100%" stopColor="#F05050" stopOpacity="0"/>
          </linearGradient>
        </defs>
        {[0.25,0.5,0.75].map((f,i)=>(
          <line key={i} x1={0} y1={(PT+PH*f).toFixed(1)} x2={W} y2={(PT+PH*f).toFixed(1)}
            stroke="rgba(255,255,255,0.04)" strokeWidth="1" strokeDasharray="3,5"/>
        ))}
        <path d={buildFill('gained')} fill="url(#fgG)"/>
        <path d={buildFill('lost')} fill="url(#fgR)"/>
        <path d={buildPath('gained')} fill="none" stroke="#3DCC7E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        <path d={buildPath('lost')} fill="none" stroke="#F05050" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        {hov!==null&&(
          <>
            <line x1={toCX(hov).toFixed(1)} y1={PT-4} x2={toCX(hov).toFixed(1)} y2={PT+PH}
              stroke="rgba(255,92,26,0.3)" strokeWidth="1" strokeDasharray="2,3"/>
            {data[hov].gained>0&&<circle cx={toCX(hov)} cy={toCY(data[hov].gained)} r="3.5" fill="#3DCC7E" stroke="var(--bg)" strokeWidth="1.5"/>}
            {data[hov].lost>0&&<circle cx={toCX(hov)} cy={toCY(data[hov].lost)} r="3.5" fill="#F05050" stroke="var(--bg)" strokeWidth="1.5"/>}
          </>
        )}
        <line x1={0} y1={(PT+PH+0.5).toFixed(1)} x2={W} y2={(PT+PH+0.5).toFixed(1)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/>
        {[{i:0,l:'24h'},{i:5,l:'18h'},{i:11,l:'12h'},{i:17,l:'6h'},{i:23,l:'now'}].map(t=>(
          <text key={t.l} x={toCX(t.i).toFixed(1)} y={H-2}
            textAnchor={t.i===0?'start':t.i===23?'end':'middle'}
            fontSize="8" fill={hov===t.i?'var(--accent)':'var(--text3)'}
            fontFamily="'JetBrains Mono',monospace">{t.l}</text>
        ))}
        {data.map((d,i)=>{
          const w=i===0||i===data.length-1?STEP/2:STEP;
          const sx=i===0?0:toCX(i)-STEP/2;
          return<rect key={`hz${i}`} x={sx} y={0} width={w} height={H} fill="transparent"
            style={{cursor:'crosshair'}} onMouseEnter={()=>setHov(i)}/>;
        })}
      </svg>
    </div>
  );
}

              <ItemLink name={item.name} style={{fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginRight:4}}/>

          {changes.lost.length>6&&<div style={{fontSize:10,color:'var(--text3)',textAlign:'center',paddingTop:2,fontFamily:"'JetBrains Mono',monospace"}}>+{changes.lost.length-6} more</div>}

// ─── VIEWS ───────────────────────────

function TrackerView({items,loading,fType,setFType,search,setSearch,chartData,acctChanges,acctDays,setAcctDays,acctLoading,hasScanned,bulkItems}){
  const[sortCfg,setSortCfg]=useState({key:'price',dir:'desc'});
  const[page,setPage]=useState(1);

  const handleSort=key=>{
    setSortCfg(prev=>({key,dir:prev.key===key?(prev.dir==='asc'?'desc':'asc'):'desc'}));
    setPage(1);
  };
  const si=key=>sortCfg.key===key?<span className="sort-ico on">{sortCfg.dir==='asc'?'↑':'↓'}</span>:<span className="sort-ico">↕</span>;

  const filtered=useMemo(()=>{
    let list=[...items];
    if(search)list=list.filter(i=>i.name.toLowerCase().includes(search.toLowerCase()));
    if(fType==='Knives')list=list.filter(i=>i.isKnife);
    if(fType==='Gloves')list=list.filter(i=>i.isGlove);
    if(fType==='StatTrak')list=list.filter(i=>i.type==='StatTrak');
    if(fType==='Souvenir')list=list.filter(i=>i.type==='Souvenir'&&!i.name.includes('Souvenir Package'));
    if(fType==='Cases')list=list.filter(i=>i.weaponType==='Container'||(i.name.includes('Case')&&!i.name.includes('Hardened')&&!i.name.includes('Capsule')));
    if(fType==='Souvenir Packages')list=list.filter(i=>i.name.includes('Souvenir Package'));
    if(fType==='Capsules')list=list.filter(i=>i.name.includes('Capsule'));
    if(fType==='Stickers')list=list.filter(i=>i.name.includes('Sticker |'));
    if(fType==='Graffitis')list=list.filter(i=>i.name.includes('Graffiti |')||i.name.includes('Sealed Graffiti'));
    if(fType==='Keychains')list=list.filter(i=>i.name.includes('Charm |'));
    list.sort((a,b)=>{
      let r=0;
      if(sortCfg.key==='price')r=b.price-a.price;
      if(sortCfg.key==='name')r=a.name.localeCompare(b.name);
      if(sortCfg.key==='type')r=a.weaponType.localeCompare(b.weaponType);
      if(sortCfg.key==='rarity')r=(RARITY_WEIGHT[getDisplayRarity(b)]||0)-(RARITY_WEIGHT[getDisplayRarity(a)]||0);
      return sortCfg.dir==='asc'?-r:r;
    });
    return list;
  },[items,search,fType,sortCfg]);

  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE));
  const pageItems=filtered.slice((page-1)*PAGE,page*PAGE);
  const totalVal=items.reduce((s,i)=>s+i.price,0);

  return(
    <div className="tracker-layout">
      {/* ── MAIN ── */}
      <div className="tracker-main">
        {/* Filter row */}
        <div className="panel" style={{padding:'10px 14px',marginBottom:12}}>
          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            <div style={{position:'relative',flexShrink:0}}>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:12,pointerEvents:'none'}}>🔍</span>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1)}}
                placeholder="Search items…" className="inp"
                style={{paddingLeft:30,width:200}}/>
            </div>
            <div className="filter-row">
              {['All','Knives','Gloves','StatTrak','Souvenir'].map(f=>(
                <button key={f} className={`pill${fType===f?' active':''}`}
                  onClick={()=>{setFType(f);setPage(1)}}>{f}</button>
              ))}
            </div>
            <span style={{marginLeft:'auto',fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'var(--text3)'}}>
              {filtered.length.toLocaleString()} items
            </span>
          </div>
        </div>

        {/* Table */}
        <div className="panel">
          <div className="tbl-head inv-grid" style={{margin:'0 0 4px'}}>
            <div style={{textAlign:'right'}}>#</div>
            <div style={{cursor:'pointer',userSelect:'none'}} onClick={()=>handleSort('name')}>NAME {si('name')}</div>
            <div style={{cursor:'pointer',userSelect:'none'}} onClick={()=>handleSort('rarity')}>RARITY {si('rarity')}</div>
            <div style={{cursor:'pointer',userSelect:'none'}} onClick={()=>handleSort('type')}>TYPE {si('type')}</div>
            <div style={{textAlign:'right',cursor:'pointer',userSelect:'none'}} onClick={()=>handleSort('price')}>PRICE {si('price')}</div>
          </div>

          {loading&&<div className="ctr"><Spinner/>Scanning inventory…</div>}
          {!loading&&filtered.length===0&&(
            <div className="empty">
              {items.length===0
                ?<>Paste a Steam profile URL above and press <strong style={{color:'var(--accent)'}}>SCAN</strong></>
                :'No items match filters.'}
            </div>
          )}

          {pageItems.map((item,i)=>{
            const rn=getDisplayRarity(item);
            const color=rc(rn);
            return(
              <div key={`${item.assetId}-${i}`} className="tbl-row inv-grid">
                <div style={{fontSize:11,color:'var(--text3)',textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}}>{(page-1)*PAGE+i+1}</div>
                <div style={{display:'flex',alignItems:'center',gap:7,minWidth:0}}>
                  <span style={{width:5,height:5,borderRadius:'50%',background:color,flexShrink:0,boxShadow:`0 0 5px ${color}88`}}/>
                  <ItemLink name={item.name} style={{fontSize:13,fontWeight:600}}/>
                </div>
                <div>
                  <span className="rarity" style={{background:`${color}18`,color,border:`1px solid ${color}44`}}>{rn}</span>
                </div>
                <div style={{fontSize:11,color:'var(--text2)'}}>{item.weaponType}</div>
                <div style={{fontSize:13,fontWeight:700,textAlign:'right',fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.04em',
                  color:item.price>=100?'var(--accent)':'var(--text)'}}>${item.price.toFixed(2)}</div>
              </div>
            );
          })}

          {totalPages>1&&(
            <div className="pager">
              <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={page===1}>← Prev</button>
              <span>Page <b style={{color:'var(--text)',fontFamily:"'Barlow Condensed',sans-serif",fontSize:13}}>{page}</b> / {totalPages}</span>
              <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={page===totalPages}>Next →</button>
            </div>
          )}
        </div>
      </div>

      {/* ── RIGHT SIDEBAR ── */}
      <div className="sidebar">
        {/* Stats */}
        <div className="sbar-sect">
          <div className="sbar-title">Inventory Stats</div>
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-label">Items</div>
              <div className="stat-val">{items.length}</div>
            </div>
            <div className="stat-card hot">
              <div className="stat-label">Value</div>
              <div className="stat-val" style={{fontSize:22}}>{fmtVal(totalVal)}</div>
            </div>
          </div>
        </div>

        {/* Chart */}
        <div className="sbar-sect">
          <div className="sbar-title">Global 24H Flow</div>
          <MiniLineChart data={chartData}/>
        </div>

        {/* Account activity */}
        <div className="sbar-sect">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,paddingBottom:8,borderBottom:'1px solid var(--border3)'}}>
            <span className="sbar-title" style={{margin:0,padding:0,border:'none'}}>Account Activity</span>
            <div style={{display:'flex',gap:3}}>
              {[1,3,7].map(d=>(
                <button key={d} className={`day-tab${acctDays===d?' active':''}`} onClick={()=>setAcctDays(d)}>{d}D</button>
              ))}
            </div>
          </div>
          <AcctChangesPanel changes={acctChanges} loading={acctLoading} hasScanned={hasScanned}/>
        </div>

        {/* Categories */}
        <div className="sbar-sect">
          <div className="sbar-title">Categories</div>
          <div style={{display:'flex',flexDirection:'column',gap:3}}>
            {['Cases','Souvenir Packages','Capsules','Stickers','Graffitis','Keychains'].map(f=>(
              <button key={f} className={`cat-btn${fType===f?' active':''}`} onClick={()=>{setFType(f);setPage(1);}}>
                <span>{f}</span>
                <span style={{fontSize:10,opacity:0.5}}>→</span>
              </button>
            ))}
          </div>
        </div>

        {/* Bulk */}
        {bulkItems.length>0&&(
          <div className="sbar-sect">
            <div className="sbar-title">Bulk Items (&gt;3)</div>
            <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:180,overflowY:'auto'}}>
              {bulkItems.map(b=>(
                <div key={b.name} className="bulk-item">
                  <ItemLink name={b.name} style={{fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}/>
                  <span className="cnt-badge">{b.count}×</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Batch scanner */}
        <div className="sbar-sect">
          <div className="sbar-title">Add Multiple Accounts</div>
          <p style={{fontSize:11,color:'var(--text3)',marginBottom:10,lineHeight:1.5,fontFamily:"'JetBrains Mono',monospace"}}>
            Paste Discord logs or link lists — extracts valid Steam URLs automatically.
          </p>
          <BatchScanner onDone={()=>{}}/>
        </div>
      </div>
    </div>
  );
}

// ─── Batch Scanner ────────────────────
function BatchScanner({onDone}){
  const[input,setInput]=useState('');
  const[running,setRunning]=useState(false);
  const[status,setStatus]=useState({found:0,skipped:0,current:0,total:0,ok:0,fail:0});
  const[logs,setLogs]=useState([]);

  const run=async()=>{
    if(!input.trim())return;
    const regex=/https?:\/\/(www\.)?steamcommunity\.com\/(id|profiles)\/[a-zA-Z0-9_-]+/gi;
    const matches=input.match(regex)||[];
    const unique=[...new Set(matches.map(u=>u.replace(/\/$/,'').toLowerCase()))];
    if(!unique.length){alert('No valid Steam links found.');return;}
    setRunning(true);setLogs([]);
    setStatus({found:unique.length,skipped:0,current:0,total:0,ok:0,fail:0});
    let existing=[];
    try{const r=await fetch('/api/tracked_urls');if(r.ok){const d=await r.json();existing=(d.urls||[]).map(u=>u.toLowerCase().replace(/\/$/,''));}}catch{}
    const toScan=[];let skipped=0;
    unique.forEach(u=>{
      const tracked=existing.some(e=>e===u||e.includes(u)||u.includes(e));
      if(tracked){skipped++;setLogs(p=>[...p,{url:u,s:'skip',msg:'Already tracked'}]);}
      else toScan.push(u);
    });
    setStatus(p=>({...p,skipped:skipped,total:toScan.length}));
    for(let i=0;i<toScan.length;i++){
      const cu=toScan[i];
      setStatus(p=>({...p,current:i+1}));
      try{
        const r=await fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steam_url:cu,force:false})});
        if(!r.ok)throw new Error('Failed');
        setStatus(p=>({...p,ok:p.ok+1}));
        setLogs(p=>[...p,{url:cu,s:'ok',msg:'Added'}]);
      }catch{
        setStatus(p=>({...p,fail:p.fail+1}));
        setLogs(p=>[...p,{url:cu,s:'err',msg:'Failed'}]);
      }
      if(i<toScan.length-1)await new Promise(r=>setTimeout(r,3000));
    }
    setRunning(false);onDone();
  };

  return(
    <div>
      <textarea value={input} onChange={e=>setInput(e.target.value)} disabled={running}
        className="batch-textarea"
        placeholder={`jacobinhio — 09/04/2026\nhttps://steamcommunity.com/profiles/76561...\nsome random text...`}/>
      <button onClick={run} disabled={running||!input.trim()} className="btn-pri" style={{width:'100%',marginTop:8,justifyContent:'center'}}>
        {running?<><Spinner size={12}/> Scanning {status.current}/{status.total}</> :'Extract & Scan Links'}
      </button>
      {(status.found>0||logs.length>0)&&(
        <div style={{marginTop:10}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:8}}>
            {[{l:'Found',v:status.found,c:'var(--blue)'},{l:'Skipped',v:status.skipped,c:'var(--accent)'},{l:'Added',v:status.ok,c:'var(--green)'},{l:'Failed',v:status.fail,c:'var(--red)'}].map(({l,v,c})=>(
              <div key={l} style={{padding:'6px 8px',background:'var(--bg3)',borderRadius:4,border:'1px solid var(--border3)'}}>
                <div style={{fontSize:9,color:'var(--text3)',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'0.1em',textTransform:'uppercase'}}>{l}</div>
                <div style={{fontSize:16,fontWeight:800,color:c,fontFamily:"'Barlow Condensed',sans-serif"}}>{v}</div>
              </div>
            ))}
          </div>
          <div style={{background:'rgba(0,0,0,0.2)',border:'1px solid var(--border3)',borderRadius:5,padding:7,maxHeight:160,overflowY:'auto'}}>
            {logs.map((log,i)=>{
              const short=log.url.split('/').filter(Boolean).pop();
              const c=log.s==='ok'?'var(--green)':log.s==='skip'?'var(--accent)':'var(--red)';
              return(
                <div key={i} className="log-item" style={{borderLeft:`2px solid ${c}`}}>
                  <span style={{fontSize:10,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{short}</span>
                  <span style={{fontSize:9,color:c,fontWeight:700,fontFamily:"'JetBrains Mono',monospace",flexShrink:0}}>{log.msg}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Recent Changes View ──────────────
function ChangesView(){
  const[changes,setChanges]=useState([]);
  const[loading,setLoading]=useState(true);
  const[filter,setFilter]=useState('Latest');

  useEffect(()=>{
    fetch('/api/recent_changes').then(r=>r.json()).then(d=>setChanges(d.changes||[])).catch(()=>{}).finally(()=>setLoading(false));
  },[]);

  const sorted=useMemo(()=>{
    let list=changes.filter(c=>c.total_gained>0||c.total_lost>0);
    if(filter==='Most Gained')list.sort((a,b)=>b.total_gained-a.total_gained);
    if(filter==='Most Lost')list.sort((a,b)=>b.total_lost-a.total_lost);
    return list;
  },[changes,filter]);

  return(
    <div className="fade-up">
      <div className="sec-hdr">
        <span className="sec-title">24H Inventory Changes</span>
        <div className="filter-row">
          {['Latest','Most Gained','Most Lost'].map(f=>(
            <button key={f} className={`pill${filter===f?' active':''}`} onClick={()=>setFilter(f)}>{f}</button>
          ))}
        </div>
      </div>
      <div className="panel">
        <div className="tbl-head chg-grid">
          <div>Profile</div><div>Time</div><div>Summary</div><div>Top Changes</div>
        </div>
        {loading&&<div className="ctr"><Spinner/>Loading changes…</div>}
        {!loading&&sorted.length===0&&<div className="empty">No inventory changes recorded yet.</div>}
        {sorted.map((c,i)=>(
          <div key={i} className="tbl-row chg-grid">
            <div style={{fontSize:11,overflow:'hidden',textOverflow:'ellipsis',minWidth:0}}>
              <a href={c.url} target="_blank" style={{color:'var(--text)',textDecoration:'none',fontSize:12,fontWeight:600}}
                onMouseEnter={e=>e.target.style.color='var(--accent)'}
                onMouseLeave={e=>e.target.style.color='var(--text)'}>
                {c.url.split('/').filter(Boolean).pop()}
              </a>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:2,fontFamily:"'JetBrains Mono',monospace",overflow:'hidden',textOverflow:'ellipsis'}}>{c.url}</div>
            </div>
            <div style={{fontSize:10,color:'var(--text3)',fontFamily:"'JetBrains Mono',monospace"}}>
              {new Date(c.time*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
              <div style={{marginTop:1}}>{new Date(c.time*1000).toLocaleDateString([],{month:'short',day:'numeric'})}</div>
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'flex-start'}}>
              {c.total_gained>0&&<span className="badge-g">+{c.total_gained}</span>}
              {c.total_lost>0&&<span className="badge-r">-{c.total_lost}</span>}
            </div>
            <div style={{fontSize:11,display:'flex',flexDirection:'column',gap:3}}>
              {c.gained.slice(0,2).map((item,j)=>(
                <div key={`g${j}`} style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{color:'var(--green)',fontSize:10,fontWeight:700,flexShrink:0}}>+{item.amount}</span>
                  <ItemLink name={item.name} style={{fontSize:11,color:'var(--green)',overflow:'hidden',textOverflow:'ellipsis'}}/>
                </div>
              ))}
              {c.lost.slice(0,2).map((item,j)=>(
                <div key={`l${j}`} style={{display:'flex',alignItems:'center',gap:5}}>
                  <span style={{color:'var(--red)',fontSize:10,fontWeight:700,flexShrink:0}}>-{item.amount}</span>
                  <ItemLink name={item.name} style={{fontSize:11,color:'var(--red)',overflow:'hidden',textOverflow:'ellipsis'}}/>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Overview View ────────────────────
function OverviewView(){
  const[data,setData]=useState([]);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    fetch('/api/overview').then(r=>r.json()).then(d=>setData(d.overview||[])).catch(()=>{}).finally(()=>setLoading(false));
  },[]);

  const hot=data.filter(i=>i.accounts>=2);

  return(
    <div className="fade-up">
      <div className="sec-hdr">
        <span className="sec-title">24H Overview — All Accounts</span>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'var(--text3)'}}>{data.length} unique items</span>
      </div>

      {!loading&&hot.length>0&&(
        <div className="hot-alert">
          <div style={{fontSize:12,fontWeight:700,color:'var(--red)',marginBottom:12,display:'flex',alignItems:'center',gap:8,fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:'0.08em',textTransform:'uppercase'}}>
            🚨 Bought by 2+ accounts in last 24h
          </div>
          {hot.map(item=>(
            <div key={item.name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderTop:'1px solid rgba(240,80,80,0.08)'}}>
              <ItemLink name={item.name} style={{fontSize:13,fontWeight:600}}/>
              <div style={{display:'flex',gap:14,alignItems:'center'}}>
                <span style={{fontSize:11,color:'var(--text3)',fontFamily:"'JetBrains Mono',monospace"}}>{item.accounts} accounts</span>
                <span style={{fontSize:14,fontWeight:800,color:'var(--red)',fontFamily:"'Barlow Condensed',sans-serif"}}>{item.amount}×</span>
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="panel">
        <div className="tbl-head ovw-grid">
          <div style={{textAlign:'right'}}>#</div>
          <div>Item Name</div>
          <div style={{textAlign:'center'}}>Amount</div>
          <div style={{textAlign:'right'}}>Accounts</div>
        </div>
        {loading&&<div className="ctr"><Spinner/>Loading overview…</div>}
        {!loading&&data.length===0&&<div className="empty">No items acquired in the last 24 hours.</div>}
        {data.map((item,i)=>{
          const isHot=item.accounts>=2;
          return(
            <div key={item.name} className="tbl-row ovw-grid"
              style={{borderLeft:isHot?'2px solid rgba(240,80,80,0.4)':'2px solid transparent',
                background:isHot?'rgba(240,80,80,0.025)':'transparent',paddingLeft:isHot?12:14}}>
              <div style={{fontSize:11,color:'var(--text3)',textAlign:'right',fontFamily:"'JetBrains Mono',monospace"}}>{i+1}</div>
              <div style={{display:'flex',alignItems:'center',gap:6,minWidth:0}}>
                {isHot&&<span style={{fontSize:12,flexShrink:0}}>🚨</span>}
                <ItemLink name={item.name} style={{fontSize:13,fontWeight:600}}/>
              </div>
              <div style={{textAlign:'center',fontSize:14,fontWeight:800,fontFamily:"'Barlow Condensed',sans-serif",
                color:isHot?'var(--red)':'var(--green)'}}>{item.amount}×</div>
              <div style={{textAlign:'right'}}>
                <span style={{fontSize:11,fontWeight:600,padding:'2px 7px',borderRadius:3,
                  background:isHot?'var(--redd)':'var(--greend)',
                  color:isHot?'var(--red)':'var(--green)',
                  border:`1px solid ${isHot?'var(--redb)':'var(--greenb)'}`,
                  fontFamily:"'JetBrains Mono',monospace"}}>
                  {item.accounts}
                </span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Portfolio View ───────────────────
function PortfolioView(){
  const[userId,setUserId]=useState('me');
  const[profileUrl,setProfileUrl]=useState('https://steamcommunity.com/id/NotnFaZe');
  const[loading,setLoading]=useState(false);
  const[portfolio,setPortfolio]=useState([]);
  const[msg,setMsg]=useState('');

  const importFn=async()=>{
    if(!profileUrl.trim()||!userId.trim())return;
    setLoading(true);setMsg('');
    try{
      const inv=await fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steam_url:profileUrl.trim(),force:false})}).then(r=>r.json());
      const res=await fetch('/api/portfolio/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId.trim(),items:inv.items})}).then(r=>r.json());
      setPortfolio(res.items||[]);setMsg(`✓ Imported ${res.items?.length||0} items`);
    }catch(e){setMsg(`⚠ ${e.message}`);}
    finally{setLoading(false);}
  };
  const loadFn=async()=>{
    if(!userId.trim())return;
    setLoading(true);setMsg('');
    try{
      const d=await fetch(`/api/portfolio/portfolio/${encodeURIComponent(userId.trim())}`).then(r=>r.json());
      setPortfolio(d.items||[]);setMsg(`✓ Loaded ${d.items?.length||0} items`);
    }catch(e){setMsg(`⚠ ${e.message}`);}
    finally{setLoading(false);}
  };

  const total=portfolio.reduce((s,p)=>s+p.quantity*p.avg_price,0);

  return(
    <div className="fade-up">
      <div className="sec-hdr">
        <span className="sec-title">Portfolio Tracker</span>
      </div>
      <div className="panel" style={{padding:'18px'}}>
        <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
          <input value={userId} onChange={e=>setUserId(e.target.value)} placeholder="User ID" className="inp" style={{width:120}}/>
          <input value={profileUrl} onChange={e=>setProfileUrl(e.target.value)} placeholder="Steam profile URL" className="inp" style={{flex:1}}/>
          <button onClick={importFn} disabled={loading} className="btn-pri">{loading?<><Spinner size={12}/>Importing…</>:'Import'}</button>
          <button onClick={loadFn} disabled={loading} className="btn-ghost">{loading?'Loading…':'Load Saved'}</button>
        </div>
        {msg&&<div style={{fontSize:12,color:msg.startsWith('⚠')?'var(--red)':'var(--green)',marginBottom:12,padding:'7px 10px',background:'rgba(255,255,255,0.02)',borderRadius:5,fontFamily:"'JetBrains Mono',monospace"}}>{msg}</div>}
        {portfolio.length>0&&(
          <>
            <div style={{fontSize:13,color:'var(--text2)',marginBottom:12,paddingBottom:10,borderBottom:'1px solid var(--border2)'}}>
              Portfolio value: <strong style={{color:'var(--accent)',fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:800}}>{fmtVal(total)}</strong>
            </div>
            <div className="tbl-head port-grid">
              <div>Item</div><div style={{textAlign:'right'}}>Qty</div>
              <div style={{textAlign:'right'}}>Avg Buy</div><div style={{textAlign:'right'}}>Total</div>
            </div>
            {portfolio.map(p=>(
              <div key={p.item_name} className="tbl-row port-grid">
                <div><ItemLink name={p.item_name} style={{fontSize:13,fontWeight:600}}/></div>
                <div style={{textAlign:'right',color:'var(--text2)',fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>{p.quantity}</div>
                <div style={{textAlign:'right',color:'var(--text2)',fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>${p.avg_price?.toFixed(2)}</div>
                <div style={{textAlign:'right',fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",fontSize:14}}>${(p.quantity*p.avg_price).toFixed(2)}</div>
              </div>
            ))}
          </>
        )}
        {!portfolio.length&&!loading&&<div className="empty">Import an inventory or load a saved portfolio.</div>}
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────
function App(){
  const[view,setView]=useState('tracker');
  const[url,setUrl]=useState('https://steamcommunity.com/id/NotnFaZe');
  const[resolvedUrl,setResolvedUrl]=useState('');
  const[loading,setLoading]=useState(false);
  const[items,setItems]=useState([]);
  const[error,setError]=useState('');
  const[cacheMsg,setCacheMsg]=useState('');
  const[search,setSearch]=useState('');
  const[fType,setFType]=useState('All');
  const[chartData,setChartData]=useState([]);
  const[acctChanges,setAcctChanges]=useState({gained:[],lost:[],total_gained:0,total_lost:0});
  const[acctDays,setAcctDays]=useState(1);
  const[acctLoading,setAcctLoading]=useState(false);

  const loadChart=useCallback(async()=>{
    try{const r=await fetch('/api/daily_chart');if(r.ok){const d=await r.json();setChartData(d.chart||[]);}}catch{}
  },[]);

  const loadAcctChanges=useCallback(async(targetUrl,days)=>{
    if(!targetUrl)return;
    setAcctLoading(true);
    try{const r=await fetch(`/api/account_changes?url=${encodeURIComponent(targetUrl)}&days=${days}`);if(r.ok){const d=await r.json();setAcctChanges(d);}}catch{}
    finally{setAcctLoading(false);}
  },[]);

  useEffect(()=>{loadChart();},[loadChart]);
  useEffect(()=>{if(resolvedUrl)loadAcctChanges(resolvedUrl,acctDays);},[acctDays,resolvedUrl,loadAcctChanges]);

  const handleScan=useCallback(async(force=false)=>{
    if(!url.trim()||loading)return;
    setLoading(true);setError('');setCacheMsg('');setView('tracker');
    try{
      const r=await fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steam_url:url.trim(),force})});
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.detail||`HTTP ${r.status}`);}
      const d=await r.json();
      setItems(d.items);setUrl(d.resolved_url);setResolvedUrl(d.resolved_url);
      setCacheMsg(d.cached?'Loaded from 24h cache.':'Fresh data synced.');
      if(!d.cached)loadChart();
      loadAcctChanges(d.resolved_url,acctDays);
    }catch(e){setError(e.message||'Failed to fetch inventory.');}
    finally{setLoading(false);}
  },[url,loading,loadChart,loadAcctChanges,acctDays]);

  const bulkItems=useMemo(()=>{
    const c={};items.forEach(i=>{c[i.name]=c[i.name]?c[i.name]+1:1;});
    return Object.entries(c).filter(([,n])=>n>3).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
  },[items]);

  const TABS=[
    {id:'tracker',label:'Tracker'},
    {id:'changes',label:'Recent Changes'},
    {id:'overview',label:'Overview'},
    {id:'portfolio',label:'Portfolio'},
  ];
  const showInput=view==='tracker';

  return(
    <>
      {/* HEADER */}
      <header className="hdr">
        <div className="hdr-inner">
          {/* Logo */}
          <div className="logo">
            <div className="logo-mark">
              <FenixBird/>
            </div>
            <div className="logo-text">
              <div className="logo-title" style={{display:'flex',alignItems:'center',gap:8}}>
                Fenix Inventory
                <a href="https://www.youtube.com/@fenixs2555" target="_blank" rel="noopener noreferrer" className="yt-btn">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.13-2.14C19.5 3.67 12 3.67 12 3.67s-7.5 0-9.37.38A3.02 3.02 0 0 0 .5 6.19C.12 8.07 0 10 0 12s.12 3.93.5 5.81A3.02 3.02 0 0 0 2.63 19.95C4.5 20.33 12 20.33 12 20.33s7.5 0 9.37-.38a3.02 3.02 0 0 0 2.13-2.14C23.88 15.93 24 14 24 12s-.12-3.93-.5-5.81zM9.75 15.02V8.98L15.5 12l-5.75 3.02z"/></svg>
                  YT
                </a>
              </div>
              <div className="logo-sub">CS2 Tracking Suite</div>
            </div>
          </div>

          {/* Nav */}
          <nav className="nav">
            {TABS.map(t=>(
              <button key={t.id} className={`nav-btn${view===t.id?' active':''}`}
                onClick={()=>setView(t.id)}>{t.label}</button>
            ))}
          </nav>

          {/* Scan bar */}
          {showInput&&(
            <div className="searchbar">
              <input
                value={url}
                onChange={e=>setUrl(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&handleScan(false)}
                placeholder="Steam profile URL or /id/name…"
                className="search-input"
              />
              <button onClick={()=>handleScan(false)} disabled={loading} className="btn-scan">
                {loading?<><Spinner size={13}/>Scanning…</>:'Scan'}
              </button>
              <button onClick={()=>handleScan(true)} disabled={loading} className="btn-refresh" title="Force fresh data">↻</button>
            </div>
          )}

          {/* Cache msg */}
          {cacheMsg&&<span style={{fontSize:11,color:'var(--accent)',fontFamily:"'JetBrains Mono',monospace",opacity:0.8,flexShrink:0}}>✓ {cacheMsg}</span>}
        </div>

        {/* Error */}
        {error&&(
          <div style={{maxWidth:1600,margin:'0 auto',padding:'0 24px 10px'}}>
            <div className="err">⚠ {error}</div>
          </div>
        )}
      </header>

      {/* MAIN */}
      <main className="main">
        {view==='tracker'&&(
          <TrackerView
            items={items} loading={loading}
            fType={fType} setFType={setFType}
            search={search} setSearch={setSearch}
            chartData={chartData}
            acctChanges={acctChanges} acctDays={acctDays} setAcctDays={setAcctDays}
            acctLoading={acctLoading} hasScanned={!!resolvedUrl}
            bulkItems={bulkItems}
          />
        )}
        {view==='changes'&&<ChangesView/>}
        {view==='overview'&&<OverviewView/>}
        {view==='portfolio'&&<PortfolioView/>}

        {/* Footer */}
        <div style={{marginTop:40,paddingTop:14,borderTop:'1px solid var(--border3)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
          <span style={{fontSize:10,color:'var(--text3)',fontFamily:"'JetBrains Mono',monospace",letterSpacing:'0.07em'}}>
            FENIX INVENTORY · PRICES VIA STEAMDT.COM · CNY → USD @ 0.14
          </span>
          <a href="https://www.youtube.com/@fenixs2555" target="_blank" rel="noopener noreferrer"
            style={{fontSize:11,color:'var(--text3)',textDecoration:'none',transition:'color 0.15s',fontFamily:"'JetBrains Mono',monospace"}}
            onMouseEnter={e=>e.currentTarget.style.color='#FF5555'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}>
            youtube.com/@fenixs2555
          </a>
        </div>
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
